name: API Dump (AArch64 Linux Build)

on:
  workflow_dispatch:
  pull_request:
  push:

env:
  CMAKE_GENERATOR: Ninja

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - uses: actions/checkout@v7

      - uses: lukka/get-cmake@latest

      - name: Configure
        run: |
            cmake -S . -B build/ --toolchain $ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -D ANDROID_PLATFORM=29 \
            -D CMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -D CMAKE_ANDROID_STL_TYPE=c++_static \
            -D ANDROID_USE_LEGACY_TOOLCHAIN_FILE=NO \
            -D CMAKE_BUILD_TYPE=Release \
            -D UPDATE_DEPS=ON \
            -G "Ninja"

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build --prefix build/install

      - name: Upload Built Binaries
        uses: actions/upload-artifact@v4
        with:
            name: android-binaries
            path: build/install/

  build-aarch64-linux:
    runs-on: ubuntu-24.04-arm
    name: "Linux aarch64 (glibc, Release)"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-aarch64-api-dump-release

      - name: Install system dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y libwayland-dev xorg-dev ninja-build

      - name: Cache external dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/external
          key: linux-aarch64-api-dump-deps-release-${{ hashFiles('scripts/known_good.json') }}

      - name: Remove Clang-specific build flags
        run: |
          grep -rl --exclude-dir=.git "ftime-trace" . | xargs -r sed -i 's/-ftime-trace//g'
  
      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D UPDATE_DEPS=ON \
            -D UPDATE_DEPS_SKIP_EXISTING_INSTALL=ON \
            -D UPDATE_DEPS_DIR=${{ github.workspace }}/external \
            -D BUILD_TESTS=OFF \
            -D BUILD_WERROR=OFF
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Install and Strip
        run: cmake --install build --prefix ${{ github.workspace }}/install --strip

      - name: Upload AArch64 API Dump Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Api_Dump_Linux_aarch64
          path: |
            ${{ github.workspace }}/install/lib/libVkLayer_api_dump.so
            ${{ github.workspace }}/install/share/vulkan/explicit_layer.d/VkLayer_api_dump.json
          retention-days: 7
